<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Automated WCAG 2.1 accessibility auditing dashboard" />
    <title>A11y Scanner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235e5ce6'/><circle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/></svg>" />
    <script>
      // Runs before React renders so the page never flashes the wrong theme.
      // Dark is the default; only an explicit "light" choice removes it.
      try {
        if (localStorage.getItem('a11y-theme') === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
